[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Deterministic eval harness for tool-using agents and cyber capability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zach" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_eval/prompts/system.txt" = "agent_eval/prompts/system.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
